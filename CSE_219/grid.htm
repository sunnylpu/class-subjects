<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        .grid{
            justify-content: center;
            display: grid;
            grid-template-columns: 100px 100px 100px ;
            gap: 50px;
            background-color: aquamarine;
            border: 2px solid black;
        }
        .grid-items{
            background-color: bisque;
            color: blue;
            justify-content: center;
            border: 3px solid black;
        }
    </style>
</head>
<body>
    <h1>this is the implementaion of the grid layout</h1>
    <div class="grid">
        
        <div class="grid-items ">header</div>
        <div class="grid-items ">footer</div>
        <div class="grid-items ">3</div>
        <div class="grid-items ">4</div>
        <div class="grid-items ">5</div>
        <div class="grid-items ">6</div>
        <div class="grid-items ">7</div>
    </div>
</body>
</html>
