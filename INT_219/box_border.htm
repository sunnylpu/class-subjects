<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>box border properties</title>
    <style>
        p{
            border: 4px solid red;
        }
        p.dotted{
            border-style: dotted;
        }
        p.solid{
            border-style: solid;
        }
        p.dashed{
            border-style: dashed;
        }
        p.double{
            border-style: double;
        }
        p.insert{
            border-style: inset;
        }
        p.ridge{
            border-style: ridge;
        }
    </style>
</head>
<body>
    <h2>the border properties are used here</h2>
    <p>some content for my class</p>
    <p class="dotted">A dotted border</p>
    <p class="solid">A dotted border</p>
    <p class="dashed">A dotted border</p>
    <p class="double">A dotted border</p>
    <p class="insert">A dotted border</p>
    <p class="ridge">A dotted border</p>

</body>
</html>
